# Cloudflare Pages 项目配置
# 文档: https://developers.cloudflare.com/pages/configuration/wrangler-configuration/
name = "tools-hub"
compatibility_date = "2026-10-01"
pages_build_output_dir = "."

# 构建命令无法在本文件中声明，需在 Dashboard 配置:
#   Cloudflare Dashboard -> Workers & Pages -> 创建 Pages 项目 -> 连接 Git 仓库
#   构建命令: npm run build
#   构建输出目录: . (已由 pages_build_output_dir 声明)
#   环境变量 (生产/预览均设置): NODE_VERSION = 20
#
# 每周自动更新版本: Pages 不支持定时构建，需另外部署
# workers/scheduled-update 定时 Worker 触发 Deploy Hook，见该目录内说明
